[project]
name = "zerotrace-control-db"
version = "0.1.0-part-a"
description = "ZeroTrace Part A — the control-group DB"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:aiosqlite.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
