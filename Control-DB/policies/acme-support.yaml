# acme / support — a business unit policy.
#
# It exists to demonstrate the one property that is most of what "enterprise
# policy" means: a business unit may move an action UP the lattice, never down.
#
#     allow  <  warn  <  tokenize  <  mask  <  block
#
# The org masks MEDICAL on the way in. Support handles no clinical cases at all,
# so it raises that to block. That is stronger, so publish accepts it.
#
# Try changing `block` to `allow` and publishing: the publish is REFUSED, at
# publish time, with this rule quoted back. See tests/test_m2_lattice.py.

version: 1
org: acme
business_unit: support
mode: enforce
default: allow
fail: closed

rules:
  - match:
      direction: inbound
      class: [MEDICAL]
    action: block
    reason: "support handles no clinical cases; medical content never reaches this BU"
