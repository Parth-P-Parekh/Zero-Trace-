# bharat-digital — a government digital services agency.
#
# The worked example for security groups. A public body is a better demonstration
# than a private company because its access control is not a preference: citizen
# identifiers are held under statute, the people who may see them are named by
# function rather than by seniority, and an auditor must be able to ask "who was
# cleared to see this, and under which rule" long after the request.
#
# The groups are the point. Five of them, each mapping to a real function:
#
#   citizen-services   handles Aadhaar, voter and PAN records for service delivery
#   revenue            handles tax and financial records
#   hr-personnel       handles staff records
#   infosec            handles infrastructure secrets
#   audit              oversight; sees decisions, never the content behind them
#
# `director` is the one role that clears inbound classes, and it clears them one
# rule at a time rather than globally — an executive override that applies to
# everything is the thing an auditor cannot distinguish from no policy at all.
#
# Rule set:
#   0-3  inbound citizen identifiers, the identifiers shared between citizen services
#        and revenue, tax records and staff records -- each masked unless the actor is
#        in a matching group.
#   4    inbound infrastructure secrets, blocked outright.
#   5    outbound credentials, blocked with NO clearance block at all.
#   6-7  outbound citizen and financial data, tokenized format-preserving.
#
# Empanelled vendors are handled by the business-unit policy
# (bharat-digital-contractors.yaml), which may only raise these actions.

version: 1
org: bharat-digital
mode: enforce
default: allow
unregistered_workload: mask
promotion: approve
fail: closed

rules:
  # 0 — citizen identifiers. The core statutory holding, and the reason the
  #     agency needs a control plane at all.
  #     CUSTOMER_DATA is here too: a grievance file or a case record is citizen data
  #     whether or not an identifier happens to appear in it. Listing only the numbers
  #     would restrict the Aadhaar and leave the case notes about that citizen open.
  - match:
      direction: inbound
      class: [AADHAAR, VOTER_ID, DL_NUMBER, CUSTOMER_DATA, QUASI_IDENTIFIER_SET]
    action: mask
    unless:
      - actor_group: [citizen-services]
      - actor_role: [director]
    reason: "citizen identifiers are served only to citizen-services and directors"

  # 1 — the identifiers that genuinely belong to BOTH functions, and the reason this
  #     rule exists separately at all.
  #
  #     A PAN is an identity document at a service counter and a tax identifier at an
  #     assessment desk; a bank account and its IFSC sit on a pension case file and on a
  #     refund order alike. When they were folded into rules 0 and 2, the strongest
  #     action won across a document's findings and the result was that a GST assessment
  #     quoting the assessee's PAN became unreadable by revenue, and a pension grievance
  #     naming the beneficiary's bank branch became unreadable by citizen-services. Every
  #     realistic document spans both, so the intersection was nobody -- which reads as a
  #     broken tool rather than as a policy, and a tool that answers "no" to everyone is
  #     one people route around.
  #
  #     Clearing both groups is not a weakening: neither group gains the other's records,
  #     only the shared identifier that appears on their own.
  - match:
      direction: inbound
      class: [PAN, BANK_ACCOUNT, IFSC]
    action: mask
    unless:
      - actor_group: [citizen-services, revenue]
      - actor_role: [director]
    reason: "shared identity and payment identifiers are served to citizen-services and revenue"

  # 2 — tax and financial records belong to revenue, not to whoever asks.
  - match:
      direction: inbound
      class: [GSTIN, FINANCIAL_RECORD]
    action: mask
    unless:
      - actor_group: [revenue]
      - actor_role: [director]
    reason: "tax and financial records are served only to revenue and directors"

  # 3 — staff records. Same shape, its own group, deliberately not merged with
  #     citizen data: one group cleared for both would defeat the separation.
  - match:
      direction: inbound
      class: [HR_RECORD]
    action: mask
    unless:
      - actor_group: [hr-personnel]
      - actor_role: [director]
    reason: "staff records are served only to hr-personnel and directors"

  # 4 — an infrastructure secret never surfaces in a model reply, for anyone
  #     outside infosec. Blocked rather than masked: a masked secret is still a
  #     secret that was retrieved.
  #
  #     The credential classes are listed here as well as outbound, and they were
  #     added because an independent audit found the gap: a deploy runbook holding a
  #     production database password, and an incident report quoting a leaked AWS key,
  #     were released to every actor including an external contractor. The detectors
  #     flagged both correctly -- as DB_URI and AWS_ACCESS_KEY -- but those classes
  #     appeared only in the outbound rule, so nothing inbound ever matched them.
  #
  #     A credential arriving from a retriever is not less dangerous than one leaving in
  #     a prompt. It is arguably worse: nobody typed it, so nobody knows it is in the
  #     context window.
  - match:
      direction: inbound
      class: [INFRA_SECRET, SECURITY_FINDING, DB_URI, PRIVATE_KEY, SSH_PRIVATE_KEY,
              AWS_ACCESS_KEY, AWS_SECRET_KEY, GITHUB_TOKEN, ANTHROPIC_KEY, OPENAI_KEY,
              JWT]
    action: block
    unless:
      - actor_group: [infosec]
    reason: "infrastructure secrets, credentials and security findings stay inside infosec"

  # 5 — a credential must never leave the agency. No `except` block, on purpose:
  #     there is no role, group or destination for which this is negotiable, and
  #     writing an empty clearance here would invite someone to fill it in.
  - match:
      direction: outbound
      class: [ANTHROPIC_KEY, OPENAI_KEY, PRIVATE_KEY, SSH_PRIVATE_KEY, JWT,
              DB_URI, INFRA_SECRET, AWS_ACCESS_KEY, AWS_SECRET_KEY, GITHUB_TOKEN]
    action: block
    reason: "a credential must not leave the agency"

  # 6 — citizen identifiers leave only as a one-way token of the same shape, so a
  #     model can still reason about "the same citizen" without holding the number.
  #
  #     The `except` block is where a role changes what you may TYPE, not only what you
  #     may read. A caseworker in citizen-services is doing casework: including a PAN in
  #     a prompt to the internal assistant is the job. Nobody else has that reason, so
  #     for everybody else it is tokenised. This is the only outbound clearance in the
  #     policy, and it deliberately does not extend to credentials.
  #     Part A cannot honour this yet: tokenize needs the vault (C8), so redact.py
  #     degrades it to mask and says so. It never fakes a token.
  - match:
      direction: outbound
      class: [AADHAAR, VOTER_ID, PAN, DL_NUMBER, QUASI_IDENTIFIER_SET]
    action: tokenize
    format_preserving: true
    except:
      - actor_group: [citizen-services]
    reason: "citizen identifiers leave only as a derived, shape-preserving token, except for caseworkers"

  # 7 — financial and staff records, same treatment.
  - match:
      direction: outbound
      class: [GSTIN, FINANCIAL_RECORD, BANK_ACCOUNT, HR_RECORD]
    action: tokenize
    format_preserving: true
    reason: "financial and staff records leave only as a derived token"

escalation:
  band_lo: 0.35
  band_hi: 0.75
  sample_rate: 0.15
