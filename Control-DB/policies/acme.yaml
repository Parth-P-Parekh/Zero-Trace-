# acme — the org policy. Three rules, which is enough to show the whole idea.
#
# Rule 2 is Part A's rule: it is the one that makes two people asking the same
# question get two different answers.

version: 1
org: acme
mode: enforce
default: allow
unregistered_workload: mask     # an unknown caller is served, but covered
promotion: approve
fail: closed

rules:
  # 0 — a credential must never leave. No exception block, on purpose.
  - match:
      direction: outbound
      class: [API_KEY, PRIVATE_KEY, JWT, DB_URI]
    action: block
    reason: "a credential must not leave the company"

  # 1 — personal data leaves as a one-way token of the same shape.
  #     Part A cannot honour this yet: tokenize needs the vault (C8, Part B),
  #     so redact.py degrades it to mask and says so. It never fakes a token.
  - match:
      direction: outbound
      class: [PAN, AADHAAR, EMAIL, PHONE, CREDIT_CARD]
    action: tokenize
    format_preserving: true
    reason: "personal data leaves only as a derived token"

  # 2 — PART A'S RULE.
  #     Cover medical and HR records coming back from the model, unless the
  #     person asking is clinical staff. Retrieval is not access control.
  - match:
      direction: inbound
      class: [MEDICAL, HR_RECORD]
    action: mask
    unless:
      - actor_group: [clinical_staff]
    reason: "the ability to retrieve a record is not permission to read it"

escalation:
  band_lo: 0.35
  band_hi: 0.75
  sample_rate: 0.15
