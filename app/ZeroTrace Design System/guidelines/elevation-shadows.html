<div class="g"><div class="c"><div class="b" style="box-shadow:var(--sh-1)"></div><div class="l">--sh-1</div></div><div class="c"><div class="b" style="box-shadow:var(--sh-2)"></div><div class="l">--sh-2</div></div><div class="c"><div class="b" style="box-shadow:var(--sh-3)"></div><div class="l">--sh-3</div></div><div class="c"><div class="b" style="box-shadow:var(--sh-4)"></div><div class="l">--sh-4</div></div></div></body></html>
