<!-- @dsCard group="Motion" viewport="700x160" name="Interaction states" subtitle="Hover raises opacity, press darkens, focus is a 3px ink ring. Never a colour change." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--paper);padding:18px;font-family:var(--font-core)}.g{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.b{height:36px;padding:0 16px;border:none;border-radius:var(--r-8);background:var(--ink);color:var(--ink-inverse);font-size:14px;display:inline-flex;align-items:center}
.h{background:#2A2A28}.p{background:#0B0B0B}.f{box-shadow:0 0 0 3px rgba(17,17,17,0.14)}.d{opacity:.36}
.gh{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--border-line)}.ghh{background:rgba(17,17,17,.05)}
.k{font:var(--type-mono-sm);color:var(--text-faint);display:block;margin-top:6px;text-align:center}.c{display:flex;flex-direction:column}</style></head><body>
<div class="g">
<div class="c"><button class="b">Dispatch</button><span class="k">rest</span></div>
<div class="c"><button class="b h">Dispatch</button><span class="k">hover</span></div>
<div class="c"><button class="b p">Dispatch</button><span class="k">press</span></div>
<div class="c"><button class="b f">Dispatch</button><span class="k">focus</span></div>
<div class="c"><button class="b d">Dispatch</button><span class="k">disabled .36</span></div>
<div class="c"><button class="b gh">Cancel</button><span class="k">ghost</span></div>
<div class="c"><button class="b gh ghh">Cancel</button><span class="k">ghost hover</span></div>
</div></body></html>
