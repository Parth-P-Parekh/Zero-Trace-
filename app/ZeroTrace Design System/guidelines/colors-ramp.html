<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--paper);padding:18px;font-family:var(--font-core)}.r{margin-bottom:12px}.rl{font:var(--type-eyebrow);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--muted);margin-bottom:6px}.rr{display:flex;gap:8px;padding:10px;border-radius:var(--r-6)}.rc{flex:1;display:flex;flex-direction:column;gap:5px;align-items:stretch}.rd{height:34px;border-radius:var(--r-4)}.rc span{font:var(--type-mono-sm);text-align:center}</style></head><body>
<div class="r"><div class="rl">On paper</div><div class="rr" style="background:var(--paper)"><div class="rc"><div class="rd" style="background:#111111;opacity:1"></div><span style="color:#111111;opacity:.52">1.00</span></div><div class="rc"><div class="rd" style="background:#111111;opacity:0.72"></div><span style="color:#111111;opacity:.52">.72</span></div><div class="rc"><div class="rd" style="background:#111111;opacity:0.52"></div><span style="color:#111111;opacity:.52">.52</span></div><div class="rc"><div class="rd" style="background:#111111;opacity:0.36"></div><span style="color:#111111;opacity:.52">.36</span></div><div class="rc"><div class="rd" style="background:#111111;opacity:0.22"></div><span style="color:#111111;opacity:.52">.22</span></div><div class="rc"><div class="rd" style="background:#111111;opacity:0.11"></div><span style="color:#111111;opacity:.52">.11</span></div></div></div>
<div class="r"><div class="rl">On dark surface</div><div class="rr" style="background:var(--surface-dark)"><div class="rc"><div class="rd" style="background:#F2F2F0;opacity:1"></div><span style="color:#F2F2F0;opacity:.52">1.00</span></div><div class="rc"><div class="rd" style="background:#F2F2F0;opacity:0.72"></div><span style="color:#F2F2F0;opacity:.52">.72</span></div><div class="rc"><div class="rd" style="background:#F2F2F0;opacity:0.52"></div><span style="color:#F2F2F0;opacity:.52">.52</span></div><div class="rc"><div class="rd" style="background:#F2F2F0;opacity:0.36"></div><span style="color:#F2F2F0;opacity:.52">.36</span></div><div class="rc"><div class="rd" style="background:#F2F2F0;opacity:0.22"></div><span style="color:#F2F2F0;opacity:.52">.22</span></div><div class="rc"><div class="rd" style="background:#F2F2F0;opacity:0.11"></div><span style="color:#F2F2F0;opacity:.52">.11</span></div></div></div>
</body></html>
