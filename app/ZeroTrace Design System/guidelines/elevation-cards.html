<!-- @dsCard group="Elevation" viewport="700x230" name="Card species" subtitle="Paper card + one dark focal card, inside a soft shell. From the reference chrome." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--paper);padding:18px;font-family:var(--font-core)}.shell{background:var(--white);border-radius:var(--r-20);box-shadow:var(--sh-4);padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{background:var(--white);border-radius:var(--r-12);box-shadow:inset 0 0 0 1px var(--border-hairline),var(--sh-2);padding:18px}
.dc{background:var(--surface-card-dark);color:var(--ink-inverse);border-radius:var(--r-12);box-shadow:var(--sh-3);padding:18px}
h4{margin:0 0 6px;font-size:16px;font-weight:400;letter-spacing:var(--tr-heading)}p{margin:0;font-size:13px;line-height:1.45;color:var(--text-quiet)}.dc p{color:var(--text-on-dark-quiet)}.k{font:var(--type-mono-sm);color:var(--text-faint);margin-top:12px}</style></head><body>
<div class="shell">
<div class="pc"><h4>Paper card</h4><p>White on paper, 1px hairline at ramp .11, radius 12, shadow sh-2.</p><div class="k">content, tables, rules</div></div>
<div class="dc"><h4>Dark card</h4><p>No border, radius 12–16, shadow sh-3. One per screen, for the thing that matters most.</p><div class="k" style="color:var(--text-on-dark-quiet)">payload, hero, blocked event</div></div>
</div></body></html>
