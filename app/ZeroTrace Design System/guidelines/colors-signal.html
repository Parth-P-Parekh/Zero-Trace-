<!-- @dsCard group="Colors" viewport="700x170" name="Signal colours" subtitle="UI only, never identity. Dots, 1px rules and soft pills — nothing larger." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--paper);padding:18px;font-family:var(--font-core)}.g{display:flex;gap:14px;margin-bottom:14px}.s{flex:1}.b{height:38px;border-radius:var(--r-4)}.n{font-size:12px;font-weight:500;margin-top:7px}.v{font:var(--type-mono-sm);color:var(--text-quiet)}
.use{display:flex;gap:8px;align-items:center;padding-top:12px;box-shadow:inset 0 1px 0 var(--border-hairline)}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500}.dot{width:6px;height:6px;border-radius:50%}</style></head><body>
<div class="g">
<div class="s"><div class="b" style="background:#3F6B3A"></div><div class="n">clean</div><div class="v">#3F6B3A</div></div><div class="s"><div class="b" style="background:#8A6A1F"></div><div class="n">redacted</div><div class="v">#8A6A1F</div></div><div class="s"><div class="b" style="background:#A8342A"></div><div class="n">blocked</div><div class="v">#A8342A</div></div><div class="s"><div class="b" style="background:#3A5A6B"></div><div class="n">info</div><div class="v">#3A5A6B</div></div>
</div>
<div class="use">
<span class="pill" style="background:#E4EBE1;color:#3F6B3A"><span class="dot" style="background:#3F6B3A"></span>Clean</span>
<span class="pill" style="background:#F0EADA;color:#8A6A1F"><span class="dot" style="background:#8A6A1F"></span>(2) redacted</span>
<span class="pill" style="background:#F2E2DF;color:#A8342A"><span class="dot" style="background:#A8342A"></span>Blocked</span>
<span style="font:var(--type-eyebrow);color:var(--muted);margin-left:6px">← the maximum permitted area</span>
</div></body></html>
