<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--paper);padding:18px;font-family:var(--font-core)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.c{height:74px;border-radius:var(--r-6);background:var(--white);box-shadow:inset 0 0 0 1px var(--border-hairline);display:flex;align-items:center;justify-content:center;overflow:hidden}
.k{font:var(--type-mono-sm);color:var(--signal-blocked);text-align:center;margin-top:7px;font-size:11px}</style></head><body>
<div class="g">
<div><div class="c"><span style="display:inline-block;transform:scaleX(1.6)"><span style="font-family:var(--font-core);font-weight:400;font-size:20px;letter-spacing:0.04em;line-height:1;color:var(--ink);display:inline-flex"><span style="opacity:1">Z</span><span style="opacity:1">E</span><span style="opacity:1">R</span><span style="opacity:1">O</span><span style="opacity:0.72">T</span><span style="opacity:0.52">R</span><span style="opacity:0.36">A</span><span style="opacity:0.22">C</span><span style="opacity:0.11">E</span></span></span></div><div class="k">no stretch</div></div>
<div><div class="c"><span style="font-family:var(--font-core);font-weight:400;font-size:20px;letter-spacing:.04em;color:var(--ink);display:inline-flex"><span style="opacity:0.11">Z</span><span style="opacity:0.22">E</span><span style="opacity:0.36">R</span><span style="opacity:0.52">O</span><span style="opacity:0.72">T</span><span style="opacity:1">R</span><span style="opacity:1">A</span><span style="opacity:1">C</span><span style="opacity:1">E</span></span></div><div class="k">no reversed fade</div></div>
<div><div class="c"><span style="font-family:var(--font-core);font-weight:400;font-size:20px;letter-spacing:0.04em;line-height:1;color:#A8342A;display:inline-flex"><span style="opacity:1">Z</span><span style="opacity:1">E</span><span style="opacity:1">R</span><span style="opacity:1">O</span><span style="opacity:0.72">T</span><span style="opacity:0.52">R</span><span style="opacity:0.36">A</span><span style="opacity:0.22">C</span><span style="opacity:0.11">E</span></span></div><div class="k">no recolour</div></div>
<div><div class="c"><span style="font-family:var(--font-core);font-weight:700;font-size:20px;letter-spacing:.04em">Zerotrace</span></div><div class="k">no weight / case change</div></div>
</div></body></html>
