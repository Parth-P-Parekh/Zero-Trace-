<!-- @dsCard group="Console" viewport="1440x900" name="ZeroTrace Console" subtitle="Sweep log, payload inspector, policy rules, integration — click through" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>ZeroTrace Console</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel" src="./ConsoleShell.jsx"></script>
<script type="text/babel" src="./SweepLog.jsx"></script>
<script type="text/babel" src="./Inspector.jsx"></script>
<script type="text/babel" src="./PolicyRules.jsx"></script>
<script type="text/babel" src="./Integration.jsx"></script>
<script type="text/babel">
const { EmptyState, Button } = window.ZeroTraceDesignSystem_7f4295;

function App(){
  const [view,setView]=React.useState('sweep');
  const [open,setOpen]=React.useState(null);
  const [rules,setRules]=React.useState(window.ZT_RULES);
  const rows=window.ZT_ROWS;
  const counts={swept:rows.length,findings:rows.reduce((n,r)=>n+r.findings.length,0),rules:rules.length};

  const toggle=(name)=>setRules(rs=>rs.map(r=>r.name===name?{...r,active:!r.active}:r));
  const del=(name)=>setRules(rs=>rs.filter(r=>r.name!==name));

  return (<>
    <ConsoleShell view={view} onView={setView} counts={counts}>
      {view==='sweep' ? <SweepLog rows={rows} onOpen={setOpen} activeId={open&&open.id}/> : null}
      {view==='findings' ? <SweepLog rows={rows.filter(r=>r.findings.length)} onOpen={setOpen} activeId={open&&open.id}/> : null}
      {view==='rules' ? <PolicyRules rules={rules} onToggle={toggle} onDelete={del}/> : null}
      {view==='integration' ? <Integration/> : null}
    </ConsoleShell>
    {open ? <Inspector row={open} onClose={()=>setOpen(null)}/> : null}
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
