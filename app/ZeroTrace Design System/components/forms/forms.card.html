<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--paper)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 28px}.stack{display:flex;flex-direction:column;gap:12px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.ZeroTraceDesignSystem_7f4295;
function Demo(){
  const [c,setC]=React.useState(true), [m,setM]=React.useState('redact'), [s,setS]=React.useState(true);
  return (<div className="grid">
    <div className="stack">
      <Input label="Rule name" defaultValue="no raw card numbers"/>
      <Input label="Pattern" mono defaultValue="\\d{3}-\\d{2}-\\d{4}"/>
      <Input icon="search" size="sm" placeholder="Search payload ids"/>
    </div>
    <div className="stack">
      <Select label="Action" options={['Redact and dispatch','Block the request','Log only']}/>
      <Input label="Upstream base URL" prefix="https://" defaultValue="api.openai.com/v1" error="Host must resolve."/>
    </div>
    <div className="stack">
      <Checkbox label="Log redacted values (hashed)" checked={c} onChange={()=>setC(!c)}/>
      <Checkbox label="Block on sweep failure" hint="Payload is not dispatched if the sweep errors."/>
      <Checkbox label="Mirror to SIEM" disabled/>
    </div>
    <div className="stack">
      <Radio name="m" checked={m==='redact'} onChange={()=>setM('redact')} label="Redact and dispatch" hint="Default. The model never sees the value."/>
      <Radio name="m" checked={m==='block'} onChange={()=>setM('block')} label="Block the request"/>
      <Switch checked={s} onChange={()=>setS(!s)} label="Active"/>
    </div>
  </div>)}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
