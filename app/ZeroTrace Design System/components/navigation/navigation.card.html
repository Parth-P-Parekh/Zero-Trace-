<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--paper)}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tr-caps);text-transform:uppercase;color:var(--muted);margin-bottom:10px}.rail{background:var(--surface-dark);border-radius:var(--r-8);padding:8px;width:232px;display:flex;flex-direction:column;gap:2px}.row{display:flex;gap:28px;align-items:flex-start}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Tabs, SegmentedControl, RailItem } = window.ZeroTraceDesignSystem_7f4295;
function Demo(){
  const [t,setT]=React.useState('redacted'), [s,setS]=React.useState('reviews'), [r,setR]=React.useState('sweep');
  return (<div style={{display:'flex',flexDirection:'column',gap:22}}>
    <div><div className="lbl">Tabs</div>
      <Tabs value={t} onChange={setT} items={[{value:'all',label:'All payloads',count:1243},{value:'redacted',label:'Redacted',count:27},{value:'blocked',label:'Blocked',count:2}]}/>
    </div>
    <div className="row">
      <div><div className="lbl">Segmented</div>
        <SegmentedControl floating value={s} onChange={setS} items={[{value:'reviews',label:'Reviews',dot:'redacted'},{value:'solve',label:'Solve'},{value:'prevent',label:'Prevent'}]}/>
      </div>
      <div><div className="lbl">Rail</div>
        <div className="rail">
          <RailItem icon="scan-line" label="Sweep log" count={1243} active={r==='sweep'} onClick={()=>setR('sweep')}/>
          <RailItem icon="list-filter" label="Policy rules" count={4} active={r==='rules'} onClick={()=>setR('rules')}/>
          <RailItem icon="settings-2" label="Integration" active={r==='int'} onClick={()=>setR('int')}/>
        </div>
      </div>
    </div>
  </div>)}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
