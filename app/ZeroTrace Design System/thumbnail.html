<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px}body{display:grid;grid-template-columns:1fr 176px;background:var(--paper)}
.main{background:var(--ink);display:flex;align-items:center;justify-content:center}
.mark{font-family:var(--font-core);font-weight:400;font-size:150px;line-height:1;letter-spacing:0.04em;color:var(--ink-inverse);white-space:nowrap;display:flex}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}.strip div{width:100%;height:100%}</style></head>
<body><div class="main"><div class="mark"><span style="opacity:1">Z</span><span style="opacity:1">E</span><span style="opacity:1">R</span><span style="opacity:1">O</span><span style="opacity:0.72">T</span><span style="opacity:0.52">R</span><span style="opacity:0.36">A</span><span style="opacity:0.22">C</span><span style="opacity:0.11">E</span></div></div>
<div class="strip"><div style="background:#8A6A1F"></div><div style="background:#3F6B3A"></div><div style="background:#3A5A6B"></div><div style="background:#A8342A"></div></div>
</body></html>
